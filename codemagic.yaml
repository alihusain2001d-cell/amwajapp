# ═══════════════════════════════════════════════════════════════
#   بناء تطبيق أمواج للآيفون — على ماك بالسحابة
#
#   ليش Codemagic: بناء iOS يحتاج ماك حقيقي وXcode. علي بويندوز،
#   فهذا الملف يأجّر ماك، يبني، ويرفع لـTestFlight لحاله.
#
#   ⚠️ كاباسيتور ٨ يستعمل Swift Package Manager مو CocoaPods.
#      يعني ماكو Podfile ولا App.xcworkspace بالمشروع أصلاً —
#      نبني ملف المشروع (.xcodeproj) مباشرة.
#
#   🔏 التوقيع أوتوماتيكي بالكامل:
#      Codemagic يسوي شهادة التوزيع وملف التعريف (provisioning
#      profile) عند أبل لحاله، من مفتاحين:
#        • مفتاح API (CodemagicAmwajKey) — محفوظ بإعدادات Codemagic
#        • مفتاح الشهادة (CERTIFICATE_PRIVATE_KEY) — بمجموعة
#          code-signing بإعدادات التطبيق
#      يعني ماكو شي ينسوّى بيد بموقع أبل.
#
#      ⚠️ مفتاح الشهادة لازم يبقى **نفسه** بكل بناء — به يلگي
#         Codemagic الشهادة الي سواها أول مرة. لو انبدّل يسوي
#         شهادة جديدة، وأبل تسمح بعدد محدود. النسخة الأصلية
#         محفوظة بفولدر «مفاتيح تطبيق ابل مهم».
# ═══════════════════════════════════════════════════════════════

workflows:
  ios-amwaj-workflow:
    name: Amwaj iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # الاسم هذا لازم يطابق اسم المفتاح بإعدادات Codemagic
      # (Personal Account ← Settings ← Integrations ← Developer Portal)
      app_store_connect: CodemagicAmwajKey

    environment:
      groups:
        - code-signing          # بيها CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.amwajmob.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # APP_STORE_APP_ID — رقم التطبيق من App Store Connect
        # (App Information ← Apple ID). ينضاف هنا بعد أول بناء ناجح.
        # ⚠️ لا تحطه فاضي "" — Codemagic يرفض الملف كله.
      # ⚠️ كاباسيتور ٨ يطلب Node 22 أو أحدث — بـ20 يفشل «cap sync».
      node: lts
      # آخر نسخة ثابتة — أبل ترفض الرفع بنسخ Xcode قديمة كل سنة.
      xcode: latest

    scripts:
      - name: تنصيب الحزم
        script: |
          npm ci || npm install

      - name: نسخ ملفات الموقع ومزامنة كاباسيتور
        script: |
          npx cap sync ios

      - name: تجهيز سلسلة المفاتيح
        script: |
          keychain initialize

      - name: جلب أو إنشاء شهادة التوقيع وملف التعريف
        # --create: إذا ماكو شهادة أو ملف تعريف عند أبل، يسويهن.
        # بالبناءات الجاية يلگي نفسهن ويستعملهن.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: إضافة الشهادة لسلسلة المفاتيح
        script: |
          keychain add-certificates

      - name: ربط التوقيع بمشروع Xcode
        script: |
          xcode-project use-profiles

      - name: رقم البناء
        # كل رفعة لأبل لازم رقم بناء أكبر من اللي قبله.
        # لو عدنا رقم التطبيق ناخذ آخر رقم من أبل ونزيد واحد،
        # وإلا ناخذ رقم البناء مال Codemagic — وهو يزيد لحاله.
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo 0)
            NEXT=$((LATEST + 1))
          else
            NEXT="$PROJECT_BUILD_NUMBER"
          fi
          echo "رقم البناء: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: بناء ملف ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - alihusain.2001.d@gmail.com
        notify:
          success: true
          failure: true

      # ⚠️ الرفع لأبل مشال لأول بناء عمداً.
      #    قسم app_store_connect يرفع الـipa **حتى لو TestFlight مطفّي**،
      #    والرفع يفشل لين تنسوّى بطاقة التطبيق بـApp Store Connect —
      #    فأول بناء ناجح كان راح يطلع «فشل». بعد ما تنسوّى البطاقة
      #    رجّع هذا القسم:
      #
      #      app_store_connect:
      #        auth: integration
      #        submit_to_testflight: true
